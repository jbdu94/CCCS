<svg viewBox="0 0 1420 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Horizontal architecture diagram: CI/CD pipeline feeds an artifact feed, which feeds a tool registry, mediated by a gateway that also checks identity, serving a downstream agent runtime, with a governance and detection layer wrapping the whole pipeline">
  <defs>
    <marker id="archArrowNeutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a3"/>
    </marker>
    <marker id="archArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4271a"/>
    </marker>
    <marker id="archArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f9d63"/>
    </marker>
    <marker id="archArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Governance & Detection band -->
  <rect x="20" y="20" width="1380" height="80" rx="12" fill="#fdf3e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="710" y="48" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#93610a">GOVERNANCE &amp; DETECTION LAYER</text>
  <text x="710" y="68" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#93610a">scripted + AI detectors · hash-chained audit log · human triage (self-consistency + evidence grounding) · SIEM forwarding (Splunk / CrowdStrike / Netskope / Zabbix)</text>

  <!-- Main pipeline row -->
  <!-- 1. CI/CD Pipeline -->
  <rect x="30" y="250" width="220" height="110" rx="10" fill="#fbe9e7" stroke="#c4271a" stroke-width="2"/>
  <text x="140" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#14181f">CI/CD Pipeline</text>
  <text x="140" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4a5265">Git repo + build runner</text>
  <text x="140" y="313" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#7b879e">Azure DevOps · AWS CodePipeline</text>
  <rect x="52" y="325" width="176" height="22" rx="11" fill="#c4271a"/>
  <text x="140" y="340" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#fff">UC4 · ATTACK SURFACE</text>

  <!-- 2. Artifact Feed -->
  <rect x="300" y="250" width="200" height="110" rx="10" fill="#fbe9e7" stroke="#c4271a" stroke-width="2"/>
  <text x="400" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#14181f">Artifact Feed</text>
  <text x="400" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4a5265">package publish + hash</text>
  <text x="400" y="313" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#7b879e">Azure Artifacts · AWS CodeArtifact</text>
  <rect x="322" y="325" width="156" height="22" rx="11" fill="#c4271a"/>
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#fff">UC4 · ATTACK SURFACE</text>

  <!-- 3. Tool / MCP Registry -->
  <rect x="550" y="250" width="220" height="110" rx="10" fill="#fbe9e7" stroke="#c4271a" stroke-width="2.5"/>
  <text x="660" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#14181f">Tool / MCP Registry</text>
  <text x="660" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4a5265">metadata, description, approval state</text>
  <text x="660" y="313" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#7b879e">Azure API Center · AWS Agent Registry</text>
  <rect x="572" y="325" width="176" height="22" rx="11" fill="#c4271a"/>
  <text x="660" y="340" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#fff">UC1 · ⚠ RUG-PULL TARGET</text>

  <!-- 4. Gateway -->
  <rect x="820" y="250" width="200" height="110" rx="10" fill="#e4f7ee" stroke="#0f9d63" stroke-width="2"/>
  <text x="920" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#14181f">Gateway</text>
  <text x="920" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4a5265">real-time scan · quarantine · rate-limit</text>
  <text x="920" y="313" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#7b879e">the only public entry point</text>
  <rect x="842" y="325" width="156" height="22" rx="11" fill="#0f9d63"/>
  <text x="920" y="340" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#fff">PREVENTION LAYER</text>

  <!-- 5. Agent Runtime -->
  <rect x="1070" y="250" width="220" height="110" rx="10" fill="#f7f8fa" stroke="#c7cedb" stroke-width="1.5"/>
  <text x="1180" y="278" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#14181f">Agent Runtime</text>
  <text x="1180" y="296" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4a5265">independent downstream consumer</text>
  <text x="1180" y="313" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#7b879e">discovers + calls tools on its own</text>
  <rect x="1092" y="325" width="176" height="22" rx="11" fill="#2c5fe0"/>
  <text x="1180" y="340" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#fff">UC3 · social engineering target</text>

  <!-- Identity Provider (below Gateway) -->
  <rect x="820" y="440" width="200" height="90" rx="10" fill="#eaf0fe" stroke="#2c5fe0" stroke-width="2"/>
  <text x="920" y="466" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#14181f">Identity Provider</text>
  <text x="920" y="484" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4a5265">credential issuance + validation</text>
  <text x="920" y="501" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#1b3fa0">UC2 · Entra ID / Workload Identity</text>

  <!-- Main flow arrows -->
  <line x1="250" y1="305" x2="298" y2="305" stroke="#c4271a" stroke-width="2" marker-end="url(#archArrowRed)"/>
  <line x1="500" y1="305" x2="548" y2="305" stroke="#c4271a" stroke-width="2" marker-end="url(#archArrowRed)"/>
  <line x1="770" y1="305" x2="818" y2="305" stroke="#c4271a" stroke-width="2" marker-end="url(#archArrowRed)"/>
  <line x1="1020" y1="305" x2="1068" y2="305" stroke="#0f9d63" stroke-width="2" marker-end="url(#archArrowGreen)"/>

  <!-- Identity -> Gateway -->
  <line x1="920" y1="438" x2="920" y2="362" stroke="#2c5fe0" stroke-width="2" marker-end="url(#archArrowGreen)"/>
  <text x="935" y="405" font-family="sans-serif" font-size="9.5" fill="#1b3fa0">validates every request</text>

  <!-- Governance band -> Registry and Gateway -->
  <line x1="660" y1="102" x2="660" y2="248" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#archArrowAmber)"/>
  <line x1="920" y1="102" x2="920" y2="248" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#archArrowAmber)"/>
  <text x="560" y="200" font-family="sans-serif" font-size="9.5" fill="#93610a">reads real telemetry</text>

  <!-- Legend -->
  <g transform="translate(30,530)">
    <rect width="11" height="11" rx="3" fill="#c4271a"/>
    <text x="17" y="10" font-family="sans-serif" font-size="10.5" fill="#4a5265">attack surface (detection, not prevention, applies here)</text>
    <rect x="330" width="11" height="11" rx="3" fill="#0f9d63"/>
    <text x="347" y="10" font-family="sans-serif" font-size="10.5" fill="#4a5265">real-time prevention</text>
    <rect x="520" width="11" height="11" rx="3" fill="#2c5fe0"/>
    <text x="537" y="10" font-family="sans-serif" font-size="10.5" fill="#4a5265">identity / trust boundary</text>
    <rect x="720" width="11" height="11" rx="3" fill="#b45309"/>
    <text x="737" y="10" font-family="sans-serif" font-size="10.5" fill="#4a5265">governance / detection (dashed = telemetry read, not a blocking control)</text>
  </g>
</svg>
