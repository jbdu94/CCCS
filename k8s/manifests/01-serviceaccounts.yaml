# One ServiceAccount per component - this is the Kubernetes-native
# equivalent of what Entra Agent ID / AWS AgentCore Identity give you in
# the cloud: each workload gets its own distinct identity, not a shared
# default one. No RBAC Roles are attached beyond the defaults (none of
# these services talk to the Kubernetes API), but having separate
# identities means a NetworkPolicy or future admission policy can target
# each component individually instead of "everything in this namespace."
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-sa
  namespace: purple-team-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-sa
  namespace: purple-team-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: purple-team-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime-sa
  namespace: purple-team-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-sa
  namespace: purple-team-lab
